# TillaPOS - build a standalone Nitro Node server and deploy to Azure App Service (Linux)
trigger:
  branches:
    include:
      - main

variables:
  azureSubscription: '192ef8e6-f6b8-4d11-9fd4-46a893264bfe'
  webAppName: 'TILLA'
  environmentName: 'TILLA'
  vmImageName: 'ubuntu-24.04'

stages:
  - stage: Build
    displayName: Build TillaPOS
    jobs:
      - job: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: Use Node.js 22
            inputs:
              version: '22.x'

          - bash: |
              curl -fsSL https://bun.sh/install | bash
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: Install Bun

          - bash: bun install --frozen-lockfile
            displayName: Install locked dependencies

          - bash: bun run build
            displayName: Build standalone Node.js application
            env:
              NITRO_PRESET: node-server

          - bash: |
              test -f .output/server/index.mjs
              test -d .output/public
            displayName: Verify production server output

          - task: ArchiveFiles@2
            displayName: Archive standalone application
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)/.output'
              includeRootFolder: true
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
            artifact: drop
            displayName: Publish deployment package

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: Deploy TillaPOS
        environment: $(environmentName)
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureRmWebAppDeployment@4
                  displayName: Deploy standalone Node.js package to TILLA
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    WebAppName: $(webAppName)
                    packageForLinux: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                    RuntimeStack: 'NODE|22-lts'
                    StartupCommand: 'node .output/server/index.mjs'
                    appSettings: '-WEBSITE_RUN_FROM_PACKAGE 1'
